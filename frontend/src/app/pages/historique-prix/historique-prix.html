
<div class="historique-container">
  <h1>Historique des prix</h1>
  <p>Consultez l'évolution des prix des produits agricoles.</p>

  <div class="filtres">
    <label for="produit">Choisir un produit :</label>
    <select id="produit">
      <option value="">Tous les produits</option>
      <option value="mil">Mil</option>
      <option value="mais">Maïs</option>
      <option value="tomate">Tomate</option>
      <option value="oignon">Oignon</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Produit</th>
        <th>Prix (FCFA)</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td colspan="3">Aucun historique chargé pour le moment.</td>
      </tr>
    </tbody>
  </table>
</div>
